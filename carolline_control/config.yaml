# CAROLLINE MuJoCo Control Stack
# Model path is relative to this repository root unless absolute.
model_path: "mujoco_menagerie-main/skydio_x2/scene_cage.xml"

# Physical parameters (CAROLLINE paper, Sec. IV.A)
cage_radius: 0.40
gravity: 9.81

# Populated at runtime from MuJoCo if left null
mass: null
inertia: null

# Rotor positions in body frame [m] — from x2.xml thrust sites
rotor_positions:
  - [-0.14, -0.18, 0.05]
  - [-0.14,  0.18, 0.05]
  - [ 0.14,  0.18, 0.08]
  - [ 0.14, -0.18, 0.08]

# Yaw drag-torque coefficients (sign matches x2.xml gear z component)
yaw_drag_coeff: [0.0154, -0.0154, 0.0154, -0.0154]

# Bidirectional motors (CAROLLINE paper) — negative thrust reverses without flipping
motor_min: -13.0
motor_max: 13.0

# ESC thrust mapping (paper Sec. IV-C, Fig. 5) — BLHeli bidirectional PWM abstraction
esc_mapping_enabled: true
esc_thrust_forward_max: 13.0
esc_thrust_reverse_max: 10.0
esc_reverse_efficiency: 0.72

# Geometric position controller (Lee et al., Eq. 19)
kx: 4.5
kv: 6.0
kx_z: 8.0
kv_z: 5.5

# Attitude / torque controller (Lee et al., Eq. 11, 20)
kR: 5.5
kOmega: 1.6

# Flight SO(3) gains used after ground-to-flight transition
kR_pre: 3.5
kOmega_pre: 2.0
pre_takeoff_thrust_fraction: 0.12

# Paper ground controller (Sec. III-A/B, Eqs. 12-20)
# Wz is large because body-z spin relies on weak propeller drag torque.
ground_omega_weights: [1.0, 1.0, 30.0]
ground_omega_kp: [8.0, 8.0, 3.0]
rolling_omega_kp: [5.5, 5.5, 2.0]
rolling_braking_distance: 2.2
ground_pseudoinverse_damping: 1.0e-6
pre_takeoff_omega_gain: 3.0
pre_takeoff_omega_limit: 7.0
pre_takeoff_omega_kp: [10.0, 10.0, 3.5]
pre_upright_settle_time: 0.12
contact_min_normal_z: 0.15
contact_force_threshold: 0.0
contact_loss_grace: 0.30
rolling_stall_speed: 0.04
rolling_stall_time: 1.5
ground_max_unload_fraction: 0.35
roll_arrival_speed: 0.45

# Outer position-to-velocity command. Motor safety is enforced independently
# by the Q allocator's ±13 N bounds, so cruise speed need not be derated here.
k_roll: 6.0
k_yaw: 0.0
rolling_max_speed: 3.50
rolling_kp: 0.65
rolling_kd: 1.05
motor_slew_rate: 700.0

# Mode transition thresholds
upright_cos_threshold: 0.92
takeoff_cos_threshold: 0.98
upright_settle_time: 0.30
upright_omega_tolerance: 0.18
takeoff_height: 0.55
hover_height: 1.0
landing_height: 0.42
ground_height_threshold: 0.45
hover_altitude_tolerance: 0.08
hover_velocity_tolerance: 0.12
takeoff_horizontal_velocity_tolerance: 0.45
min_airborne_thrust_fraction: 0.15
landing_settle_time: 1.0
hover_before_flight_time: 5.0
min_flight_center_z: 0.72

# Mission: roll on ground -> upright -> fly cardinal legs -> return & land
initial_mode: ROLLING
random_initial_orientation: true
ground_z: 0.40

mission:
  spawn_xy: [0.0, 0.0]
  roll_target: [5.0, 5.0]
  roll_position_tolerance: 0.25
  leg_distance: 3.0
  segment_duration: 6.0
  waypoint_reach_tolerance: 0.15
  waypoint_dwell_time: 3.0
  mission_yaw: 0.0

waypoints:
  - [8.0, 4.0, 1.0]
  - [8.0, 8.0, 1.0]
  - [4.0, 8.0, 1.0]
  - [0.0, 0.0, 1.0]
  

# Simulation
timestep: 0.002
sim_duration: 180.0
idle_exit_delay: 3.0
viewer_realtime: false
viewer_speed: 1.0
viewer_hold_after_idle: 25.0
viewer_substeps: 20
viewer_target_fps: 30.0
viewer_sync_state_only: true
viewer_log_decimation: 4
log_path: "carolline_control/logs/flight_log.csv"
plot_path: "carolline_control/plots/actual_vs_desired.png"
