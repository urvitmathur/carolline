# SLAM / exploration navigation parameters
# Used by: scripts/simulate_slam_exploration.py

model_path: "mujoco_menagerie-main/skydio_x2/scene_cage.xml"

map:
  width_m: 36.0
  height_m: 36.0
  resolution: 0.05
  inflation_radius: 0.42
  log_odds_hit: 0.85
  log_odds_miss: -0.4

localization:
  search_xy: 0.35
  search_yaw_deg: 12.0
  xy_step: 0.07
  yaw_step_deg: 3.0
  update_interval_steps: 8

odometry:
  process_noise: 0.02
  initial_covariance: 0.05

planning:
  replan_interval_s: 2.5
  min_waypoint_spacing: 0.8

exploration:
  seed: 11
  spawn: [-12.0, 0.0]
  goal: [10.0, 0.0]
  num_obstacles: 3
  patrol_speed: 2.6
  obstacle_min_size: 0.8
  obstacle_max_size: 2.2
  arena_half_x: 14.0
  arena_half_y: 10.0
  stop_distance: 0.65
  fly_clearance: 0.55
  max_obstacle_height: 1.0
  max_flight_height: 1.85
  max_roll_height: 0.35
  blocked_confirm_time: 0.35
  hover_before_flight_time: 0.5

perception:
  max_range: 8.0
  forward_cone_deg: 75.0
  dense_rays: true
  dense_ray_count: 24

simulation:
  timestep: 0.004
  duration: 240.0
  settle_steps: 350
  random_orientation: false
